[package]
name = "agent-company-desktop-beta"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
default-run = "agent-company-beta"

[lib]
name = "agent_company_desktop"
path = "src/lib.rs"

[[bin]]
name = "agent-company-beta"
path = "src/main.rs"

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = "1.23"
getrandom = "0.3"
base64 = "0.22"
cookie = "0.18"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[package]
name = "agent-company-native-checks"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
path = "lib.rs"

# Keep these exact versions aligned with ../src-tauri/Cargo.lock.
# This crate tests the original native contract modules without building Tauri.
[dependencies]
base64 = "=0.22.1"
cookie = "=0.18.2"
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
uuid = "=1.26.1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
